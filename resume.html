<style>
:root{--paper:#f3f1eb;--ink:#111;--muted:#6b6b65;--line:#d9d5cc;--accent:#2357ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.bar{height:76px;padding:0 max(20px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);background:rgba(243,241,235,.92);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10}.brand{font-weight:850;letter-spacing:-.03em;text-decoration:none;color:var(--ink)}.actions{display:flex;gap:9px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border:1px solid var(--ink);text-decoration:none;color:var(--ink);font-size:.82rem;font-weight:700;background:transparent}.btn.primary{background:var(--ink);color:var(--paper)}.btn.primary:hover{background:var(--accent);border-color:var(--accent)}.viewer{width:min(940px,calc(100% - 32px));height:calc(100vh - 108px);margin:16px auto;background:#fff;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.08)}iframe{border:0;width:100%;height:100%;display:block}@media(max-width:620px){.bar{height:68px;padding:0 14px}.brand{display:none}.actions{width:100%;justify-content:space-between}.viewer{width:100%;height:calc(100vh - 68px);margin:0;border:0;box-shadow:none}.btn{padding:9px 12px}}
</style>
</head>

  </div>
</header>
<main class="viewer">
